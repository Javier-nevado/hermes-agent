      - MCP_PORT=5110

  mcp-twenty:
    build: ./abi/mcps/docker/servers/mcp_twenty
    image: opteia/mcp-twenty:1.0.0
    container_name: mcp-twenty
    ports: ["127.0.0.1:5111:5111"]
    volumes:
      - /home/iris/workspace/agent/credentials:/credentials:ro
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - MCP_PORT=5111

  mcp-invoice-ninja:
    build: ./abi/mcps/docker/servers/mcp_invoice_ninja
    image: opteia/mcp-invoice-ninja:1.0.0
    container_name: mcp-invoice-ninja
    ports: ["127.0.0.1:5112:5112"]
    volumes:
      - /home/vera/workspace/agent/credentials:/credentials:ro
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - MCP_PORT=5112

  mcp-proxmox:
    build: ./abi/mcps/docker/servers/mcp_proxmox
    image: opteia/mcp-proxmox:1.0.0
    container_name: mcp-proxmox
    ports: ["127.0.0.1:5113:5113"]
    volumes:
      - /home/atlas/workspace/agent/credentials:/credentials:ro
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - MCP_PORT=5113

