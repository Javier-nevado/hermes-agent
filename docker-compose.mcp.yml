#
# docker-compose.mcp.yml — Stateless MCP containers
#
# Agents pass credentials with each tool call. No volume mounts needed.
#

services:
  mcp-brevo:
    build: ./abi/mcps/docker/servers/mcp_brevo
    image: opteia/mcp-brevo:latest
    container_name: mcp-brevo
    ports: ["127.0.0.1:5109:5109"]
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - MCP_PORT=5109

  mcp-invoice-ninja:
    build: ./abi/mcps/docker/servers/mcp_invoice_ninja
    image: opteia/mcp-invoice-ninja:latest
    container_name: mcp-invoice-ninja
    ports: ["127.0.0.1:5112:5112"]
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - MCP_PORT=5112

  mcp-m365:
    build: ./abi/mcps/docker/servers/mcp_m365
    image: opteia/mcp-m365:latest
    container_name: mcp-m365
    ports: ["127.0.0.1:5110:5110"]
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - MCP_PORT=5110

  mcp-proxmox:
    build: ./abi/mcps/docker/servers/mcp_proxmox
    image: opteia/mcp-proxmox:latest
    container_name: mcp-proxmox
    ports: ["127.0.0.1:5113:5113"]
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - MCP_PORT=5113

  mcp-twenty:
    build: ./abi/mcps/docker/servers/mcp_twenty
    image: opteia/mcp-twenty:latest
    container_name: mcp-twenty
    ports: ["127.0.0.1:5111:5111"]
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - MCP_PORT=5111
