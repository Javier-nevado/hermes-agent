#
# docker-compose.mcp.yml — ABI MCP Server Containers
#
# Usage:
#   docker compose -f docker-compose.mcp.yml up -d
#   docker compose -f docker-compose.mcp.yml up -d mcp-brevo  # single server
#
# All containers bind to 127.0.0.1 only (no external access).
# Credentials are mounted read-only from agent home directories.
#
# Install new servers: sudo /opt/hermes-agent/scripts/abi-mcp-install <name>
#

services:
  # === EXISTING SERVERS (5) ===

  mcp-brevo:
    build: ./abi/mcps/docker/servers/mcp_brevo
    image: opteia/mcp-brevo:1.0.0
    container_name: mcp-brevo
    ports: ["127.0.0.1:5109:5109"]
    volumes:
      - /home/ailean/workspace/agent/credentials:/credentials:ro
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - MCP_PORT=5109

  mcp-m365:
    build: ./abi/mcps/docker/servers/mcp_m365
    image: opteia/mcp-m365:1.0.0
    container_name: mcp-m365
    ports: ["127.0.0.1:5110:5110"]
    volumes:
      - /home/iris/workspace/agent/credentials:/credentials:ro
    restart: unless-stopped
    mem_limit: 128m
