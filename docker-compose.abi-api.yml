# ABI Memory API Server — PostgreSQL + API in Docker
#
# All secrets loaded from .env file (gitignored). Create .env with:
#   ABI_DB_USER=abi_agent
#   ABI_DB_PASSWORD=<per-deployment-password>
#   ABI_DB_NAME=abi_memory
#   OPTEIA_LICENSE_KEY=<license-key>
#   LICENSE_JWT_SECRET=<jwt-secret>   # DEPRECATED — RS256 public key is shipped
#                                     # in the image (abi/license/abi-license.pub).
#                                     # Keep only during the HS256→RS256 cutover.
#
# Usage: docker compose --env-file .env -f docker-compose.abi-api.yml up -d
services:
  abi-db:
    image: pgvector/pgvector:pg17
    container_name: abi-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ABI_DB_USER:-abi_agent}
      POSTGRES_PASSWORD: ${ABI_DB_PASSWORD:?ABI_DB_PASSWORD required}
      POSTGRES_DB: ${ABI_DB_NAME:-abi_memory}
    volumes:
      - abi-db-data:/var/lib/postgresql/data
    networks:
      - opteia-net
    # No ports exposed to host — internal only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abi_agent -d abi_memory"]
      interval: 10s
      timeout: 5s
      retries: 5

  abi-api:
    build:
      context: .
      dockerfile: Dockerfile.abi-api
    container_name: abi-memory-api
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - ABI_DATABASE_URL=postgresql://${ABI_DB_USER:-abi_agent}:${ABI_DB_PASSWORD}@abi-db:5432/${ABI_DB_NAME:-abi_memory}
      - OPTEIA_LICENSE_KEY=${OPTEIA_LICENSE_KEY:?OPTEIA_LICENSE_KEY required}
      # RS256 (bundled public key) is the primary verifier; LICENSE_JWT_SECRET is the
      # legacy HS256 fallback, optional post-RS256-cutover (empty = RS256-only boot).
      - LICENSE_JWT_SECRET=${LICENSE_JWT_SECRET:-}
      - OPTEIA_API_VERSION=1.0.0
    networks:
      - opteia-net
    depends_on:
      abi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- CamoFox Browser (anti-detection browse/search backend) ---
  # Host agents reach it at http://localhost:9377. Set CAMOFOX_URL=http://localhost:9377
  # in the agent's ~/.hermes/.env to route the native browser tool through CamoFox
  # (is_camofox_mode() activates whenever CAMOFOX_URL is set).
  camofox:
    image: ghcr.io/jo-inc/camofox-browser:latest
    container_name: abi-camofox
    ports:
      - "9377:9377"
    environment:
      - CAMOFOX_PORT=9377
      # Idle timeouts — tuned for interactive agent workflows. Defaults (5 min) reap
      # a tab mid-task during natural review/drafting gaps, which the agent then
      # misreads as "camofox down". The browser still relaunches on demand regardless
      # (ensureBrowser()); these just keep a working tab/session alive longer.
      - TAB_INACTIVITY_MS=1800000      # 30 min — tab survives gaps (default 300000)
      - BROWSER_IDLE_TIMEOUT_MS=3600000  # 60 min — browser stays warm (default 300000)
    restart: unless-stopped
    networks:
      - opteia-net

  # ------------------------------------------------------------------
  # Kanboard (opt-in task board). Enable with COMPOSE_PROFILES=kanban in docker.env.
  # Shares abi-db (separate `kanboard` DB, created idempotently by kanboard-db-init).
  # Stock files bind-mounted from ./kanboard/. Per-customer vars: see
  # kanboard/docker.env.example (KANBOARD_CF_TEAM / KANBOARD_CF_APP_AUD / etc).
  # ------------------------------------------------------------------
  kanboard-db-init:
    profiles: ["kanban"]
    image: postgres:17-alpine
    container_name: abi-kanboard-db-init
    depends_on:
      abi-db:
        condition: service_healthy
    environment:
      - PGPASSWORD=${ABI_DB_PASSWORD:?ABI_DB_PASSWORD required}
      - PGUSER=${ABI_DB_USER:-abi_agent}
      - PGHOST=abi-db
      - PGDATABASE=postgres
    entrypoint:
      - sh
      - -c
      - 'psql -tAc "SELECT 1 FROM pg_database WHERE datname=''kanboard''" | grep -q 1 || psql -c "CREATE DATABASE kanboard OWNER ${ABI_DB_USER:-abi_agent}"'
    networks:
      - opteia-net
    restart: "no"

  kanboard:
    profiles: ["kanban"]
    image: kanboard/kanboard:latest
    container_name: opteia-kanboard
    depends_on:
      kanboard-db-init:
        condition: service_completed_successfully
    environment:
      # Native kanboard env-driven config. The image declares these in
      # /etc/php84/php-fpm.d/env.conf, so they reach the fpm workers (a custom
      # config.php reading getenv() does NOT — fpm clear_env strips it).
      # DB_RUN_MIGRATIONS=true lets kanboard auto-install + upgrade its schema,
      # so no manual SQL import is needed on a fresh shared DB.
      - DB_DRIVER=postgres
      - DB_HOSTNAME=abi-memory-db
      - DB_PORT=5432
      - DB_NAME=kanboard
      - DB_USERNAME=${ABI_DB_USER:-abi_agent}
      - DB_PASSWORD=${ABI_DB_PASSWORD:?ABI_DB_PASSWORD required}
      - DB_RUN_MIGRATIONS=true
      - DEBUG=false
      # Reverse-proxy auth: nginx + cfverify validate the CF Access JWT (auth_request),
      # then forward CF-Access-Authenticated-User-Email, which kanboard trusts.
      - REVERSE_PROXY_AUTH=true
      - REVERSE_PROXY_USER_HEADER=HTTP_CF_ACCESS_AUTHENTICATED_USER_EMAIL
      - REVERSE_PROXY_EMAIL_HEADER=HTTP_CF_ACCESS_AUTHENTICATED_USER_EMAIL
      - REVERSE_PROXY_DEFAULT_ADMIN=${KANBOARD_DEFAULT_ADMIN:-admin}
      - TRUSTED_PROXY_NETWORKS=172.16.0.0/12,127.0.0.1/32
    volumes:
      # No config.php mount — native env-driven config. data/ (uploads) + plugins/
      # (OpteiaSkin theme) stay as bind-mounts; abi-update.sh chowns them pre-extract.
      - ./kanboard/data:/var/www/app/data
      - ./kanboard/plugins:/var/www/app/plugins
    networks:
      - opteia-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  kanboard-cfverify:
    profiles: ["kanban"]
    build:
      context: ./kanboard
      dockerfile: Dockerfile.cfverify
    container_name: opteia-kanboard-cfverify
    environment:
      - CF_TEAM=${KANBOARD_CF_TEAM:-opteia}
      - CF_APP_AUD=${KANBOARD_CF_APP_AUD:-}
      - ENFORCE=${KANBOARD_ENFORCE:-false}
    volumes:
      - ./kanboard/cf_access_verifier.py:/app/cf_access_verifier.py:ro
    networks:
      opteia-net:
        aliases:
          - cf-access-verifier   # matches the upstream name in nginx.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  kanboard-proxy:
    profiles: ["kanban"]
    image: nginx:alpine
    container_name: opteia-kanboard-proxy
    depends_on:
      kanboard:
        condition: service_healthy
      kanboard-cfverify:
        condition: service_healthy
    ports:
      - "${KANBOARD_PROXY_PORT:-8096}:80"
    volumes:
      - ./kanboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - opteia-net
    restart: unless-stopped

networks:
  opteia-net:
    driver: bridge

volumes:
  abi-db-data:
