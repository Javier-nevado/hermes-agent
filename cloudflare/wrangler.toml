name = "opteia-license-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"

routes = [
  { pattern = "api.opteia.com/*", zone_name = "opteia.com" }
]

kv_namespaces = [
  { binding = "LICENSES", id = "PLACEHOLDER_KV_NAMESPACE_ID" }
]

[vars]
ENVIRONMENT = "production"

# Secrets (set via `wrangler secret put`):
# - LICENSE_JWT_SECRET: HMAC-SHA256 shared secret
# - INVOICE_NINJA_WEBHOOK_SECRET: HMAC for IN webhook verification
