# Opteia Kanboard reverse-proxy entry point (Cloudflare Tunnel -> nginx -> Kanboard)
# LAN-facing only (host-bound to 192.168.20.19:8096 in docker-compose).
# Kanboard REVERSE_PROXY_AUTH=true reads HTTP_CF_ACCESS_AUTHENTICATED_USER_EMAIL.
# Cloudflare Access identity is verified: nginx auth_request -> cf-access-verifier
# validates Cf-Access-Jwt-Assertion vs Cloudflare public keys (team: opteia).
server {
    listen 80;
    server_name kanban-test.opteia.com;

    client_max_body_size 25m;

    # Verify the Cloudflare Access JWT before trusting the identity header.
    auth_request /_cf_access_verify;
    error_page 403 = @denied;
    location @denied { default_type text/plain; return 403 "Access denied"; }

    location = /_cf_access_verify {
        internal;
        proxy_pass http://cf-access-verifier:8080/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    }

    # Service worker: served by Kanboard at its plugin path, allowed to control "/"
    # (scope). Inherits the server-level Cloudflare Access auth_request.
    location = /plugins/OpteiaSkin/Asset/pwa/sw.js {
        proxy_pass http://kanboard:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Service-Worker-Allowed / always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://kanboard:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # Cloudflare terminates TLS at the edge
        # Cloudflare Access headers (incl. Cf-Access-Authenticated-User-Email + Cf-Access-Jwt-Assertion)
        # are forwarded to the upstream by default; Kanboard reads the email via $_SERVER['HTTP_*'].
    }
}
