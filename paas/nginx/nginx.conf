# nginx — abi-paas web/reverse-proxy.
# Listens on :80 IN-CONTAINER. The compose publishes ${LAN_IP}:8090:80, which binds
# it to the box's LAN interface ONLY — ZeroTier (Opteia management) can't reach it.
# (LAN-only is enforced at the Docker publish layer, not here.)
# Per-app routes live in /etc/nginx/apps/<name>.conf (written by the mgmt API).

worker_processes 1;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # nginx access/error symlink to stdout/stderr (entrypoint) → supervisord logs.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 65;
    # app uploads (dashboards importing files) can be sizeable
    client_max_body_size 50m;
    # gzip text payloads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/csv image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;

        # liveness probe (compose healthcheck + provisioner readiness)
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # per-app routes (dynamic proxy_pass OR static alias), included by the mgmt API
        include /etc/nginx/apps/*.conf;
    }
}
