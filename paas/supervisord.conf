# supervisord — process manager for abi-paas.
# Owns the two base services (nginx + the mgmt API) and includes per-app programs
# written by the mgmt API at /etc/supervisor/conf.d/app-<name>.conf. The mgmt API
# drives this daemon via `supervisorctl` (reread/update/start/stop/restart).

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
# quiet the startup banner spam; logs still go to the per-program files
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# nginx — serves the LAN. `daemon off;` so supervisord supervises it (restart-on-crash).
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
startsecs=2
stdout_logfile=/var/log/supervisor/nginx.out.log
stderr_logfile=/var/log/supervisor/nginx.err.log

# mgmt API — the agent's control surface (token-authed). Comes up after nginx.
[program:paas-mgmt-api]
command=/usr/bin/python3 /opt/paas-mgmt/api.py
directory=/opt/paas-mgmt
autostart=true
autorestart=true
priority=20
startsecs=2
stdout_logfile=/var/log/supervisor/mgmt-api.out.log
stderr_logfile=/var/log/supervisor/mgmt-api.err.log

# Per-app programs are written here by the mgmt API on deploy.
[include]
files = /etc/supervisor/conf.d/*.conf
