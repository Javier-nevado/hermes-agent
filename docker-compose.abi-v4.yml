    container_name: abi-camofox-vera
    volumes: [camofox-vera:/root/.camofox]

networks:
  hermes-agent_opteia-net:
    external: true

volumes:
  abi-hermes-mga:      {external: true}
  abi-hermes-ailean:   {external: true}
  abi-hermes-atlas:    {external: true}
  abi-hermes-jen:      {external: true}
  abi-hermes-iris:     {external: true}
  abi-hermes-caspian:  {external: true}
  abi-hermes-sol:      {external: true}
  abi-hermes-vera:     {external: true}
  camofox-mga:         {}   # per-agent browser profiles (compose-created)
  camofox-ailean:      {}
  camofox-atlas:       {}
  camofox-jen:         {}
  camofox-iris:        {}
  camofox-caspian:     {}
  camofox-sol:         {}
  camofox-vera:        {}
