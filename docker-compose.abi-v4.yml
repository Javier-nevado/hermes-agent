  # ─────────────────────── vera (marketing) ───────────────────────
  abi-agent-vera:
    <<: *agent-common
    container_name: abi-agent-vera
    volumes: [abi-hermes-vera:/opt/data, /opt/abi-tools/skills:/opt/abi-tools/skills:ro, /opt/abi-tools/greenlights:/opt/abi-tools/greenlights:ro]
    environment:
      <<: *agent-env
      HERMES_UID: "1007"
      HERMES_GID: "1008"
      ABI_AGENT_ID: ${VERA_AGENT_ID:-}
      OPTEIA_LICENSE_KEY: ${VERA_SEAT:-}
